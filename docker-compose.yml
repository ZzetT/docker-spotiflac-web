services:
  docker-spotiflac-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-spotiflac-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8085}:8080"
    shm_size: '1gb'
    volumes:
      # Mount supporter AppImage (place your SpotiFLAC-Next .AppImage here)
      - ${APPIMAGE_PATH:-./appimage}:/app/appimage:ro
      # Mount host configuration & active supporter session (or set CONFIG_PATH=./config in .env)
      - ${CONFIG_PATH:-${HOME}/.spotiflac-next}:/root/.spotiflac-next
      # Destination directory where downloaded FLAC albums will be stored
      - ${DOWNLOADS_PATH:-./downloads}:/root/Music
      # Live mounts for web UI and server
      - ./web:/app/web
      - ./web_server.py:/app/web_server.py
      - ./extract_frontend.py:/app/extract_frontend.py
      - ./wails-browser-shim.js:/app/wails-browser-shim.js
      - ./entrypoint.sh:/app/entrypoint.sh
    environment:
      - HOST_PORT=${HOST_PORT:-8085}
      - PORT=8080
      - BRIDGE_PORT=8081
      - WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
